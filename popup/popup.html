<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF Focus</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="icon-container">
                <span class="main-icon">🎯</span>
            </div>
            <h1>WF Focus</h1>
        </div>

        <!-- Onboarding screen (shown on first launch) -->
        <div id="onboardingScreen">
            <div class="onboarding-card">
                <p class="onboarding-title">Activate WF Focus</p>
                <p class="onboarding-desc">Enter your email to unlock the extension. No spam, ever.</p>
                <input type="email" id="emailInput" class="email-input" placeholder="you@example.com" />
                <button id="activateBtn" class="primary-btn">Activate for free</button>
                <p id="activateError" class="activate-error" style="display:none;">Please enter a valid email.</p>
            </div>
        </div>

        <!-- Main screen (shown after activation) -->
        <div id="mainScreen" style="display:none;">

            <!-- Live focus tracker (hidden when focus mode is inactive) -->
            <div id="focusTracker" class="focus-tracker" style="display: none;">
                <div class="focus-tracker-header">
                    <span class="focus-dot"></span>
                    <span class="focus-title">Focus active on <strong id="focusedClassName"></strong></span>
                </div>
                <p class="focus-subtitle">Classes to restore (in order):</p>
                <div id="focusClassList" class="focus-class-list"></div>
            </div>

            <div class="settings-card">
                <div class="setting-item">
                    <div class="info">
                        <span class="label">Extension Active</span>
                        <span class="desc">Enable Shift+Click isolation</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="extensionActive" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="setting-item vertical">
                    <div class="info">
                        <span class="label">Overlay Opacity</span>
                        <span id="opacityVal" class="badge-val">10%</span>
                    </div>
                    <input type="range" id="overlayOpacity" min="0" max="40" value="10" class="range-slider">
                </div>
            </div>

            <button id="coffeeBtn" class="coffee-btn">☕ Buy me a coffee</button>

            <div class="footer">
                <p>Version 1.0.0</p>
                <button id="resetDefaults" class="secondary-btn">Reset Defaults</button>
            </div>

        </div>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>

</html>
